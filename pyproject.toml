[project]
name = "my-github-mcp-project"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.122.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=4.2.0",
    "mcp>=1.29.0",
    "requests>=2.34.2",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gateway", "agents"]
